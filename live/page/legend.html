<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- The legend alone, readable without the map. The same content opens over
       the map from the Legend button: legend.js writes both, from the dictionary. -->
  <title data-i18n="legendTitle">Legend of the map</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="theme-hypervibe.css" />
  <script src="theme-early.js"></script>
  <style>
    /* Alone, the page scrolls (over the map, its section does). */
    html, body { height: auto; overflow: auto; font-size: 15px; line-height: 1.6; }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 70px; }
    h1 { font-size: 26px; margin: 0 0 6px; }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="legendTitle">Legend of the map</h1>
    <div id="legend-body"></div>
  </main>
  <script type="module" src="legend-page.js"></script>
</body>
</html>
