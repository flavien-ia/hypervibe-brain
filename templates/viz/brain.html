<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperbrain</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<style>
  :root { --bg: #f7f6f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #d9d6cf; --accent: #3b5bdb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111214; --panel: #1b1c1f; --ink: #ececef; --muted: #9a9aa2; --line: #2e3035; --accent: #8ea4ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
  #graph { position: relative; }
  #cy { position: absolute; inset: 0; }
  header { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
  header > * { pointer-events: auto; }
  h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; }
  input, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  input { width: 220px; }
  .count { color: var(--muted); font-size: 12px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 20px; }
  aside h2 { font-size: 18px; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin: 0 4px 4px 0; font-size: 12px; }
  .excerpt { white-space: pre-wrap; margin: 12px 0; }
  .links a { display: block; color: var(--accent); text-decoration: none; padding: 2px 0; cursor: pointer; }
  .legend { margin-top: 18px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .offline { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 40px; color: var(--muted); }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: 60vh 40vh; } aside { border-left: 0; border-top: 1px solid var(--line); } input { width: 150px; } }
</style>
</head>
<body>
<div id="app">
  <div id="graph">
    <header>
      <h1 id="title"></h1>
      <input id="q" type="search">
      <select id="domain"></select>
      <select id="type"></select>
      <span class="count" id="count"></span>
    </header>
    <div id="cy"></div>
    <div class="offline" id="offline"></div>
  </div>
  <aside id="panel"></aside>
</div>
<script>
const DATA = /*HYPERBRAIN_DATA*/null;
const WORDS = {
  fr: { title: (n) => `Le brain de ${n}`, search: "Chercher une fiche", allDomains: "Tous les domaines", allTypes: "Tous les types",
    count: (n, l) => `${n} fiches, ${l} liens`, pick: "Cliquez sur une fiche pour la lire.", links: "Liens", backlinks: "Pointent vers elle",
    seed: "graine", trusted: "fiable", archived: "archivée", private: "Fiche privée : son contenu n'est jamais affiché ici.",
    legend: "Couleur : domaine. Taille : nombre de liens. Pointillés : graine (pas encore validée).", source: "Source",
    offline: "La carte a besoin d'une connexion internet pour charger sa bibliothèque d'affichage.",
    types: { idea: "idées", concept: "concepts", note: "notes", project: "projets", person: "personnes", organization: "organisations", publication: "publications", event: "événements", source: "sources" } },
  en: { title: (n) => `${n}'s brain`, search: "Search a note", allDomains: "All domains", allTypes: "All types",
    count: (n, l) => `${n} notes, ${l} links`, pick: "Click a note to read it.", links: "Links", backlinks: "Linked from",
    seed: "seed", trusted: "trusted", archived: "archived", private: "Private note: its content is never shown here.",
    legend: "Colour: domain. Size: number of links. Dashed: seed (not validated yet).", source: "Source",
    offline: "The map needs an internet connection to load its display library.",
    types: { idea: "ideas", concept: "concepts", note: "notes", project: "projects", person: "people", organization: "organizations", publication: "publications", event: "events", source: "sources" } },
};
const W = WORDS[DATA.lang] || WORDS.en;
const PALETTE = ["#4c6ef5", "#e8590c", "#2f9e44", "#c2255c", "#1098ad", "#f08c00", "#7048e8", "#5c940d", "#d6336c", "#495057"];
const colour = Object.fromEntries(DATA.domains.map((d, i) => [d, PALETTE[i % PALETTE.length]]));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const byId = new Map(DATA.nodes.map((n) => [n.id, n]));
const degree = new Map();
for (const e of DATA.edges) for (const k of [e.source, e.target]) degree.set(k, (degree.get(k) || 0) + 1);

document.getElementById("title").textContent = W.title(DATA.name);
document.getElementById("q").placeholder = W.search;
document.getElementById("count").textContent = W.count(DATA.nodes.length, DATA.edges.length);
const dSel = document.getElementById("domain");
dSel.innerHTML = `<option value="">${esc(W.allDomains)}</option>` + DATA.domains.map((d) => `<option>${esc(d)}</option>`).join("");
const tSel = document.getElementById("type");
tSel.innerHTML = `<option value="">${esc(W.allTypes)}</option>` + Object.entries(W.types).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
const panel = document.getElementById("panel");
const legend = `<div class="legend"><p>${esc(W.legend)}</p>${DATA.domains.map((d) => `<span><i class="dot" style="background:${colour[d]}"></i>${esc(d)}</span>`).join("")}</div>`;
panel.innerHTML = `<p class="meta">${esc(W.pick)}</p>${legend}`;

if (typeof cytoscape === "undefined") {
  const o = document.getElementById("offline");
  o.style.display = "flex";
  o.textContent = W.offline;
} else {
  if (typeof cytoscapeFcose !== "undefined") cytoscape.use(cytoscapeFcose);
  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements: [
      ...DATA.nodes.map((n) => ({ data: { id: n.id, label: n.title, colour: colour[n.domains[0]] || "#868e96", size: 14 + Math.min(40, 4 * (degree.get(n.id) || 0)) }, classes: [n.status, n.private ? "private" : ""].join(" ") })),
      ...DATA.edges.map((e, i) => ({ data: { id: `e${i}`, source: e.source, target: e.target } })),
    ],
    style: [
      { selector: "node", style: { "background-color": "data(colour)", width: "data(size)", height: "data(size)", label: "data(label)", "font-size": 9, color: getComputedStyle(document.body).color, "text-valign": "bottom", "text-margin-y": 3, "text-max-width": 120, "text-wrap": "ellipsis", "min-zoomed-font-size": 7, "border-width": 0 } },
      { selector: "node.seed", style: { "border-width": 2, "border-style": "dashed", "border-color": "data(colour)", "background-opacity": 0.55 } },
      { selector: "node.private", style: { "background-color": "#343a40" } },
      { selector: "edge", style: { width: 1, "line-color": getComputedStyle(document.documentElement).getPropertyValue("--line"), "curve-style": "haystack", opacity: 0.8 } },
      { selector: ".faded", style: { opacity: 0.08 } },
      { selector: "node:selected", style: { "border-width": 3, "border-style": "solid", "border-color": "#fab005" } },
    ],
    layout: { name: typeof cytoscapeFcose !== "undefined" ? "fcose" : "cose", animate: false, quality: "default", nodeRepulsion: 6000, idealEdgeLength: 70 },
    wheelSensitivity: 0.25,
  });

  const show = (id) => {
    const n = byId.get(id);
    if (!n) return;
    const out = DATA.edges.filter((e) => e.source === id).map((e) => byId.get(e.target)).filter(Boolean);
    const inn = DATA.edges.filter((e) => e.target === id).map((e) => byId.get(e.source)).filter(Boolean);
    const link = (m) => `<a data-id="${esc(m.id)}">${esc(m.title)}</a>`;
    panel.innerHTML = `<h2>${esc(n.title)}</h2>
      <div class="meta">${esc(W.types[n.type] || n.type)} · ${esc(W[n.status] || n.status)} · ${esc(n.created)}</div>
      <div>${n.domains.map((d) => `<span class="chip" style="border-color:${colour[d]}">${esc(d)}</span>`).join("")}</div>
      <div class="excerpt">${n.private ? esc(W.private) : esc(n.excerpt)}${n.excerpt.length >= 400 ? "…" : ""}</div>
      ${n.source ? `<div class="meta">${esc(W.source)} : ${esc(n.source)}</div>` : ""}
      ${out.length ? `<h3>${esc(W.links)}</h3><div class="links">${out.map(link).join("")}</div>` : ""}
      ${inn.length ? `<h3>${esc(W.backlinks)}</h3><div class="links">${inn.map(link).join("")}</div>` : ""}
      ${legend}`;
    for (const a of panel.querySelectorAll("a[data-id]")) a.onclick = () => { cy.$id(a.dataset.id).select(); cy.animate({ center: { eles: cy.$id(a.dataset.id) }, duration: 300 }); show(a.dataset.id); };
  };
  cy.on("tap", "node", (e) => show(e.target.id()));

  const filter = () => {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const d = dSel.value;
    const t = tSel.value;
    let shown = 0;
    cy.nodes().forEach((node) => {
      const n = byId.get(node.id());
      const ok = (!q || n.title.toLowerCase().includes(q) || n.excerpt.toLowerCase().includes(q)) && (!d || n.domains.includes(d)) && (!t || n.type === t);
      node.toggleClass("faded", !ok);
      if (ok) shown++;
    });
    cy.edges().forEach((e) => e.toggleClass("faded", e.source().hasClass("faded") || e.target().hasClass("faded")));
    document.getElementById("count").textContent = q || d || t ? `${shown} / ${DATA.nodes.length}` : W.count(DATA.nodes.length, DATA.edges.length);
  };
  for (const id of ["q", "domain", "type"]) document.getElementById(id).addEventListener("input", filter);
}
</script>
</body>
</html>
