# The test bench on the three systems the plugin promises: Windows, macOS and
# Linux, with the oldest Node it accepts and the current one. It is the only
# real proof that the plugin works on a Mac when it is developed on a PC.
name: banc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  banc:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ["22.16", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax of every script
        shell: bash
        run: for f in scripts/*.mjs tests/*.mjs live/*.mjs live/i18n/*.mjs live/page/*.js live/page/i18n/*.js; do node --check "$f"; done
      # Every bench runs, even when the one before it failed (2026-11-27: on
      # Node 22.16 the third one stopped, and neither the fourth nor any part
      # of the plugin was tried there; one run must say everything that fails).
      - name: The whole journey of a brain
        if: ${{ !cancelled() }}
        run: node tests/banc.mjs
      - name: Two computers, one brain
        if: ${{ !cancelled() }}
        run: node tests/banc-sync.mjs
      - name: The cloud copy, without Cloudflare
        if: ${{ !cancelled() }}
        run: node tests/banc-cloud.mjs
      - name: The update of the plugin
        if: ${{ !cancelled() }}
        run: node tests/banc-update.mjs
      # Each part of the plugin, one after the other, all of them even when one
      # fails (2026-11-27: the locks, the approvals and the switches had only ever
      # run on the computer they were written on).
      - name: Each part of the plugin
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          failed=""
          for z in tests/zones/*.mjs; do
            echo "::group::$z"
            node "$z" || failed="$failed $z"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
